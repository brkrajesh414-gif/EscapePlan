name: Build EscapePlan Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Build Android Debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK Generated
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk not found!"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload EscapePlan-debug-apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscapePlan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
