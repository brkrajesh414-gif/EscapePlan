name: Build Room v5 Firebase APK
on:
  push:
    branches: ["codex/build-room-v5-apk"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract Room v5 source
        run: |
          test "$(git hash-object EscapePlan-v2-Room-v5-Firebase-source.zip)" = "4687cc76024cfb7ac31d001f40d1003a2a5c3ab6"
          unzip -q EscapePlan-v2-Room-v5-Firebase-source.zip -d room-v5-build
          test -f room-v5-build/EscapePlan/app/build.gradle.kts
      - name: Apply compiler compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("room-v5-build/EscapePlan/app/src/main/java/com/example")
          screen = root / "ui/screens/PlaceCatalogScreen.kt"
          text = screen.read_text()
          assert "import androidx.compose.foundation.layout.weight\n" in text
          screen.write_text(text.replace("import androidx.compose.foundation.layout.weight\n", ""))
          exporter = root / "util/TripExporter.kt"
          text = exporter.read_text()
          assert "PdfDocument().use" in text, "PDF receiver requires further inspection"
          text += "\nprivate inline fun <T> android.graphics.pdf.PdfDocument.use(block: (android.graphics.pdf.PdfDocument) -> T): T = try { block(this) } finally { close() }\n"
          exporter.write_text(text)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" "build-tools;36.0.0"'
      - name: Validate catalogue and migration
        working-directory: room-v5-build/EscapePlan
        run: |
          python3 check_catalog.py
          python3 tests/check_places_catalog.py
          python3 tests/check_hidden_places_catalog.py
          python3 tests/check_migration.py
          node --test functions/validation.test.js
      - name: Run Android unit tests
        working-directory: room-v5-build/EscapePlan
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Build APK
        working-directory: room-v5-build/EscapePlan
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose room-v5-build/EscapePlan/app/build/outputs/apk/debug/app-debug.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: EscapePlan-Room-v5-Firebase-debug
          path: room-v5-build/EscapePlan/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Room-v5-test-reports
          path: room-v5-build/EscapePlan/app/build/reports/
          if-no-files-found: ignore
